<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Configurações</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "@borion/api": "./borion-api/index.js",
      "@borion/api/window": "./borion-api/window.js"
    }
  }
  </script>
  <script type="module" src="config.js"></script>
</head>
<body>
  <main>
    <section>
      <h3>Tema</h3>
      <div class="linha">
        <label><input type="radio" name="tema" value="claro"> Claro</label>
        <label><input type="radio" name="tema" value="escuro"> Escuro</label>
      </div>
      <p class="dica">Muda todas as janelas na hora: <code>emitTo('*', 'tema', ...)</code>.</p>
    </section>
    <section>
      <div class="linha"><button id="contar">invoke('contar')</button></div>
      <p id="contagem" class="saida"></p>
      <div class="linha"><button id="fechar">Fechar</button></div>
    </section>
  </main>
</body>
</html>
