<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>{{TITLE_HTML}}</title>
</head>
<body>
  <main>
    <h1>{{TITLE_HTML}}</h1>
    <p class="suave">Interface com Vite (<code>frontend\</code>), lógica nativa em Delphi
      (<code>{{PROGRAM}}.dpr</code>). Rode o <code>dev.bat</code> e edite
      <code>frontend\src\main.js</code>: a mudança aparece na hora.</p>

    <section>
      <h2>Um comando Delphi</h2>
      <form id="form-saudar" class="linha">
        <input id="nome" placeholder="seu nome" autofocus>
        <button>Saudar</button>
      </form>
      <p id="saudacao" class="saida"></p>
    </section>

    <section>
      <h2>Um plugin</h2>
      <div class="linha">
        <button id="abrir">Escolher um arquivo...</button>
      </div>
      <p id="arquivo" class="saida"></p>
    </section>
  </main>
  <footer id="rodape" class="suave"></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
